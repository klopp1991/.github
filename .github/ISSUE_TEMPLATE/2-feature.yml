name: Feature
description: Etwas Neues soll dazukommen.
title: ""
labels: ["type:feature"]
body:
  - type: textarea
    id: was
    attributes:
      label: Was möchtest Du?
    validations:
      required: true
  - type: textarea
    id: wozu
    attributes:
      label: Wozu brauchst Du es?
      description: Hilft dem Team, die beste Lösung zu finden.
  - type: textarea
    id: beispiel
    attributes:
      label: Beispiel oder Zielzustand?
      description: Optional. Z. B. eine Situation, in der Du es nutzen würdest, oder wie es aussehen soll, wenn es fertig ist.
  - type: textarea
    id: idee
    attributes:
      label: Wie stellst Du es Dir vor?
      description: Optional. Skizze, Beispiel oder Link.
