name: Change
description: Etwas Bestehendes soll anders oder besser werden, auch Optik und Umbau.
title: ""
labels: ["type:change"]
body:
  - type: textarea
    id: was
    attributes:
      label: Was soll anders werden?
    validations:
      required: true
  - type: textarea
    id: warum
    attributes:
      label: Warum?
      description: Was stört heute?
  - type: textarea
    id: ziel
    attributes:
      label: Beispiel oder Zielzustand?
      description: Optional. Z. B. wie es aussehen oder funktionieren soll, wenn es fertig ist.
  - type: textarea
    id: unveraendert
    attributes:
      label: Was soll gleich bleiben?
      description: Optional. Was auf keinen Fall verändert werden soll.
